name: diag-tmp
on:
  push:
    branches: [claude/keen-babbage-29yghl]
    paths: [.github/workflows/diag-tmp.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -q -r requirements.txt
      - run: |
          cd scripts && python - <<'PY'
          import requests, fetch_feeds as F
          urls=["http://pension.blog88.fc2.com/?xml","http://arms22.blog91.fc2.com/?xml","http://etrip.blog.fc2.com/?xml"]
          for u in urls:
              for name,h in [("ours",{"User-Agent":F.UA,"Accept":F.ACCEPT}),("noaccept",{"User-Agent":F.UA}),("browser",{"User-Agent":F.BROWSER_UA}),("curl",{"User-Agent":"curl/8.5.0","Accept":"*/*"})]:
                  r=requests.get(u,headers=h,timeout=20)
                  print(name.ljust(9),r.status_code,[x.status_code for x in r.history],r.url)
          PY
